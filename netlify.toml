[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[[plugins]]
package = "@netlify/plugin-emails"

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301
  force = true

[[redirects]]
  from = "/groups"
  to = "/groups.html"
  status = 301
  force = true

[[redirects]]
  from = "/intensives"
  to = "/intensives.html"
  status = 301
  force = true

[[redirects]]
  from = "/ceus"
  to = "/ceus.html"
  status = 301
  force = true

# programs.html (Assessments & Classes) was split into groups.html and
# intensives.html. The intensive was the only live content, so old links land there.
[[redirects]]
  from = "/programs"
  to = "/intensives.html"
  status = 301
  force = true

[[redirects]]
  from = "/programs.html"
  to = "/intensives.html"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 301
  force = true

[[redirects]]
  from = "/terms-conditions"
  to = "/terms-conditions.html"
  status = 301
  force = true

[[redirects]]
  from = "/no-surprises"
  to = "/no-surprises.html"
  status = 301
  force = true

# Short path for the printed flyer QR code. 302 (not 301) so it can be
# repointed later without browsers or search engines caching the target.
[[redirects]]
  from = "/intensive"
  to = "/intensives.html#secure-male-intensive"
  status = 302
  force = true